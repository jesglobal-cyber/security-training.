<!DOCTYPE html>
<html lang="mk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Security Awareness</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f6f8;
            margin: 0;
            padding: 40px 20px;
        }

        .box {
            max-width: 650px;
            margin: 60px auto;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.08);
            text-align: center;
        }

        h1 {
            color: #222;
        }

        p {
            color: #444;
            font-size: 17px;
            line-height: 1.6;
        }

        .warning {
            margin-top: 30px;
            padding: 18px;
            background: #fff3cd;
            border-radius: 8px;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>Ова беше безбедносна симулација.</h1>

    <p>
        Овој email беше дел од интерна phishing-вежба.
    </p>

    <p>
        Ако ова беше вистински напад, со кликнувањето можевте
        да бидете пренасочени кон страница што бара корисничко
        име и лозинка.
    </p>

    <div class="warning">
        <strong>Запомнете:</strong><br>
        Не внесувајте лозинки или MFA кодови преку неочекувани
        линкови во email.
    </div>

</div>

</body>
</html>
